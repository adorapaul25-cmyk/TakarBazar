<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>FX™ ARNOB TRADER</title>
    <script src="https://telegram.org/js/telegram-webapp.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; text-align: center; padding: 20px; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="loading-screen"><p>ইউজার ডাটা চেক করা হচ্ছে...</p></div>
    
    <h1>স্বাগতম, <span id="topName">ইউজার</span></h1>
    <p>আপনার ব্যালেন্স: <span id="mBal">0.00</span> টাকা</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCItXGC1it79tWhw4Ye2lIM_c2kjEC-37c",
            authDomain: "takar-bazar-a0e29.firebaseapp.com",
            projectId: "takar-bazar-a0e29",
            storageBucket: "takar-bazar-a0e29.firebasestorage.app",
            messagingSenderId: "87892978211",
            appId: "1:87892978211:web:9470062c89685d285b5f96",
            databaseURL: "https://takar-bazar-a0e29-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tg = window.Telegram.WebApp;
        tg.expand();
        let tgUser = tg.initDataUnsafe?.user;
        let userId = tgUser ? tgUser.id : "7218579149";
        let userName = tgUser ? tgUser.first_name : "User";

        window.onload = () => {
            document.getElementById('topName').innerText = userName;
            get(ref(db, 'users/' + userId)).then((snap) => {
                let data = snap.exists() ? snap.val() : { balance: 265.00 };
                document.getElementById('mBal').innerText = data.balance;
                document.getElementById('loading-screen').style.display = 'none';
            });
        };
    </script>
</body>
</html>
