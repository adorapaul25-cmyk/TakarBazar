<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>FX™ ARNOB TRADER</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; text-align: center; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="card">
        <h1>স্বাগতম, <span id="topName">ইউজার</span></h1>
        <p>আপনার ব্যালেন্স: ৳<span id="mBal">0.00</span></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCItXGC1it79tWhw4Ye2lIM_c2kjEC-37c",
            authDomain: "takar-bazar-a0e29.firebaseapp.com",
            projectId: "takar-bazar-a0e29",
            databaseURL: "https://takar-bazar-a0e29-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // সরাসরি ডাটা লোড করা
        const userId = "7218579149"; // টেস্ট আইডি
        
        get(ref(db, 'users/' + userId)).then((snap) => {
            if (snap.exists()) {
                const data = snap.val();
                document.getElementById('topName').innerText = data.name;
                document.getElementById('mBal').innerText = data.balance;
            } else {
                document.getElementById('topName').innerText = "নতুন মেম্বার";
                document.getElementById('mBal').innerText = "265.00";
            }
        }).catch((e) => {
            document.getElementById('topName').innerText = "Error!";
        });
    </script>
</body>
</html>
