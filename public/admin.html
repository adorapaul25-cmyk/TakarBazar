<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাস্টার অ্যাডমিন কন্ট্রোল প্যানেল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-weight/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .admin-container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 20px; color: #ef4444; margin-bottom: 20px; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .section-title { font-size: 14px; font-weight: bold; color: #f97316; margin: 15px 0 10px 0; display: flex; align-items: center; gap: 8px; }
        .input-group { background: #111827; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 6px; }
        .input-box { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: white; font-size: 14px; outline: none; margin-bottom: 10px; }
        .input-box:focus { border-color: #f97316; }
        .btn-save { width: 100%; background: #ef4444; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { background: #dc2626; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #94a3b8; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2><i class="fas fa-user-shield"></i> FX™ MASTER ADMIN</h2>
        
        <div class="section-title"><i class="fas fa-cog"></i> গ্লোবাল প্রাইজ রেট সেটিংস</div>
        <div class="input-group">
            <label>প্রতি অ্যাড দেখার ইনকাম (৳)</label>
            <input type="number" step="0.01" id="admAdRate" class="input-box" placeholder="যেমন: ১.৫০">
            
            <label>প্রতি রেফারে কত টাকা বোনাস (৳)</label>
            <input type="number" step="0.01" id="admRefRate" class="input-box" placeholder="যেমন: ৫.০০">
        </div>

        <div class="section-title"><i class="fas fa-users"></i> ইউজার লাইভ ডাটা টেস্ট কন্ট্রোল</div>
        <div class="input-group">
            <label>ইউজার ব্যালেন্স (৳)</label>
            <input type="number" id="admBal" class="input-box">
            
            <label>মোট অ্যাড ভিউ সংখ্যা</label>
            <input type="number" id="admAds" class="input-box">
            
            <label>মোট রেফারেল সংখ্যা</label>
            <input type="number" id="admRef" class="input-box">
        </div>

        <button class="btn-save" onclick="saveAdminData()"><i class="fas fa-save"></i> কনফিগারেশন লাইভ সেভ করুন</button>
        
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> ইউজার ড্যাশবোর্ডে ফিরুন</a>
    </div>

    <script>
        // বর্তমান ডাটাগুলো ইনপুট বক্সে লোড করা
        document.getElementById('admBal').value = localStorage.getItem('b_balance') || "0";
        document.getElementById('admAds').value = localStorage.getItem('b_totalAds') || "0";
        document.getElementById('admRef').value = localStorage.getItem('b_totalRef') || "0";
        document.getElementById('admAdRate').value = localStorage.getItem('cfg_perAdIncome') || "1.50";
        document.getElementById('admRefRate').value = localStorage.getItem('cfg_perRefIncome') || "5.00";

        function saveAdminData() {
            let bal = document.getElementById('admBal').value;
            let ads = document.getElementById('admAds').value;
            let ref = document.getElementById('admRef').value;
            let adRate = document.getElementById('admAdRate').value;
            let refRate = document.getElementById('admRefRate').value;

            // সব ডাটা লোকাল স্টোরেজে পুশ করা হচ্ছে
            localStorage.setItem('b_balance', bal);
            localStorage.setItem('b_totalAds', ads);
            localStorage.setItem('b_totalRef', ref);
            localStorage.setItem('cfg_perAdIncome', adRate);
            localStorage.setItem('cfg_perRefIncome', refRate);

            alert("সব কাস্টমাইজেশন এবং রেট সাকসেসফুলি লাইভ সেভ হয়েছে ভাই! 🚀");
            window.location.href = "index.html"; // সেভ হয়ে স্বয়ংক্রিয়ভাবে মেইন ড্যাশবোর্ডে নিয়ে যাবে
        }
    </script>
</body>
</html>
