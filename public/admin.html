<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মাস্টার টাস্ক কন্ট্রোল</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-weight/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .admin-container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 20px; }
        h2 { font-size: 20px; color: #f97316; text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #334155; }
        .input-group { background: #111827; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .input-box { width: 100%; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: white; outline: none; margin-bottom: 10px; }
        .btn-save { width: 100%; background: #f97316; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .task-list-item { background: #1f2937; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2><i class="fas fa-tasks"></i> FX™ DAILY TASK MANAGER</h2>
        
        <div class="input-group">
            <h4 style="color:#f97316; margin-bottom:10px;">➕ নতুন টাস্ক যোগ করুন</h4>
            <input type="text" id="tTitle" class="input-box" placeholder="টাস্কের নাম (যেমন: b5000 Cash Rewards)">
            <input type="number" step="0.01" id="tReward" class="input-box" placeholder="টাকার পরিমাণ (যেমন: ১৫.০০)">
            <button class="btn-save" onclick="addNewTask()">পাবলিশ টাস্ক</button>
        </div>

        <div class="input-group">
            <h4 style="color:#10b981; margin-bottom:10px;">📋 বর্তমান একটিভ টাস্ক সমূহ</h4>
            <div id="live-admin-tasks">লোডিং...</div>
        </div>

        <a href="index.html" style="display:block; text-align:center; color:#94a3b8; margin-top:15px; text-decoration:none; font-size:13px;">হোম পেজে ফিরুন</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCItXGC1it79tWhw4Ye2lIM_c2kjEC-37c",
            authDomain: "takar-bazar-a0e29.firebaseapp.com",
            projectId: "takar-bazar-a0e29",
            storageBucket: "takar-bazar-a0e29.firebasestorage.app",
            messagingSenderId: "87892978211",
            appId: "1:87892978211:web:9470062c89685d285b5f96",
            measurementId: "G-TV9WFW07VE",
            databaseURL: "https://takar-bazar-a0e29-default-rtdb.firebaseio.com/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // নতুন টাস্ক এড করা
        window.addNewTask = function() {
            let title = document.getElementById('tTitle').value.trim();
            let reward = document.getElementById('tReward').value.trim();
            if(!title || !reward) { alert("সব বক্সে তথ্য লিখুন ভাই!"); return; }

            const taskId = "task_" + Date.now();
            set(ref(db, 'tasks_center/' + taskId), { title: title, reward: parseFloat(reward) })
            .then(() => {
                alert("টাস্ক সফলভাবে লাইভ করা হয়েছে! 🚀");
                document.getElementById('tTitle').value = "";
                document.getElementById('tReward').value = "";
            });
        };

        // টাস্ক ডাটা লাইভ আপডেট রিড করা
        onValue(ref(db, 'tasks_center'), (snapshot) => {
            const listDiv = document.getElementById('live-admin-tasks');
            listDiv.innerHTML = "";
            if(snapshot.exists()) {
                const data = snapshot.val();
                for(let id in data) {
                    listDiv.innerHTML += `
                        <div class="task-list-item">
                            <div>
                                <b>${data[id].title}</b> <br>
                                <span style="color:#10b981; font-size:12px;">টাকা: ৳${data[id].reward}</span>
                            </div>
                            <button class="btn-del" onclick="deleteTask('${id}')">মুছে ফেলুন</button>
                        </div>
                    `;
                }
            } else {
                listDiv.innerHTML = "কোনো একটিভ টাস্ক পাওয়া যায়নি।";
            }
        });

        window.deleteTask = function(id) {
            if(confirm("টাস্কটি ডিলিট করতে চান?")) {
                remove(ref(db, 'tasks_center/' + id));
            }
        };
    </script>
</body>
</html>
